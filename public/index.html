<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taco Tom's Lunch Truck</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="navigation">
            <a href="#" class="nav-logo">Taco Tom's</a>

            <div class="nav-links">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">Menu</a>
                <a href="#" class="nav-link">About</a>
                <a href="#" class="nav-link">Contact</a>
                <a href="#" class="nav-link">Gallery</a>
                <a href="#" class="nav-link">Hours</a>
                <a href="#" class="nav-link nav-cta">Order Now</a>
            </div>
        </nav>
    </header>

    <main>
        <!-- FIRST SECTION -->
        <section class="hero-section">
            <div class="hero-overlay">
                <div class="hero-content">
                    <!-- PRIMARY HEADER -->
                    <h1 class="hero-title">TACO TOM'S LUNCH TRUCK</h1>
                    <p class="hero-subtitle">Authentic Mexican food made fresh and served fast.</p>
                </div>

                <!-- BACKGROUND IMAGE -->

                <div class="hero-cards">
                    <!-- JUMP TO MENU PAGE -->
                    <div class="card info-card">
                        <h2 class="card-title">Our Menu</h2>
                        <p class="card-text">Real ingredients, real flavor — made fresh every day.</p>
                        <a href="#" class="card-button">View Menu</a>
                    </div>

                    <!-- INCORPORATE DOORDASH WEBSITE -->
                    <div class="card info-card">
                        <h2 class="card-title">Mexican Eats To Go</h2>
                        <p class="card-text">Order for pickup or delivery.</p>
                        <a href="#" class="card-button">Order Now</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
